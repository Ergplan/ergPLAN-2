# Landed cost per kWh at the meter, worked by hand in tests/e2e/test_ts_assumed.py (Stage 17), for
# Stage 19's calculator test. Consumer: TGSPDCL HT-I(A) Industry General, 33 kV, contract demand
# 3,000 kVA; APPROVED rules in force on 1 November 2026 (month 11). The same in every ToD slot.
# Inputs stated by the client: PPA tariff (solar 3.10, wind 3.60), group-captive equity cost 0.25/kWh.
# A captive plant is priced at its levelised cost on ergPLAN's plant assumptions for Telangana (an
# assumption, not an order figure).
# Arithmetic: total = generation + T&D charge + CSS (third party) + equity (group captive). No
# open-access loss, additional surcharge, banking or settlement rule is approved for Telangana, so
# none is in the sum (rule gaps; the landed-cost screen says so).
# Documents: ORDER = TGERC Retail Supply Tariff Order FY 2026-27 (TGSPDCL, TGNPDCL), document
# 0c84182f-4a13-5915-9fcb-b98639b59622 (PDF page; printed page 140).
state: TS
discom: tgspdcl
category: HT-I(A)
voltage_kv: "33"
contract_demand_kva: "3000"
as_of: "2026-11-01"
month: 11
slot: all
sources:
  td_charge: {value: "0.09", document: ORDER, page: 152, where: "3.21.22, TGSPDCL 33 kV, Rs/kWh (doubtful as a wheeling charge: an input to the CSS formula; Table 3-43 uses D = 0.21 at 33 kV)"}
  css: {value: "1.73", document: ORDER, page: 152, where: "Table 3-43, HT-I Industry at 33 kV, allowable CSS"}
routes:
  - route: captive
    source: solar
    lines: {generation: "2.8950", td_charge: "0.0900", css: "0.0000", equity: "0.0000"}
    total: {value: "2.9850", note: "generation is the plant's levelised cost (assumption); CSS exempt (captive)"}
  - route: captive
    source: wind
    lines: {generation: "3.6087", td_charge: "0.0900", css: "0.0000", equity: "0.0000"}
    total: {value: "3.6987", note: "generation is the plant's levelised cost (assumption); CSS exempt (captive)"}
  - route: group_captive
    source: solar
    lines: {generation: "3.1000", td_charge: "0.0900", css: "0.0000", equity: "0.2500"}
    total: {value: "3.4400", note: "CSS exempt (group captive)"}
  - route: group_captive
    source: wind
    lines: {generation: "3.6000", td_charge: "0.0900", css: "0.0000", equity: "0.2500"}
    total: {value: "3.9400", note: "CSS exempt (group captive)"}
  - route: third_party
    source: solar
    lines: {generation: "3.1000", td_charge: "0.0900", css: "1.7300", equity: "0.0000"}
    total: {value: "4.9200"}
  - route: third_party
    source: wind
    lines: {generation: "3.6000", td_charge: "0.0900", css: "1.7300", equity: "0.0000"}
    total: {value: "5.4200"}
