# Landed cost per kWh at the meter, Uttar Pradesh (PVVNL HV-2, urban, 33 kV, contract demand 5,000 kVA:
# the site of tests/e2e/test_up_assumed.py), rules in force on 1 November 2026, month 11. Worked by
# hand for Stage 19's calculator test (tests/e2e/test_calculator_hand.py) from the pages cited, apart
# from the app's code. The same in every ToD slot: no open-access line varies by slot.
#
# Documents
#   ORDER = UPERC State DISCOMs Tariff Order FY 2026-27, document e071ac95-048e-58dc-a9da-b2e59365f106
#           (PDF pages): p. 377 intra-state transmission charge Rs. 0.3075/kWh (10.2.1); p. 379 average
#           wheeling charge Rs. 0.9318/kWh (Table 10-3); p. 384 intra-state transmission loss 3.18%
#           (10.4.11) and distribution loss at 33 kV 3.00% (Table 10-11); p. 386 CSS for HV-2 above
#           11 kV and up to 66 kV Rs. 0.49/kWh (Table 10-14, the approved column).
#   CRE   = UPERC (Captive and Renewable Energy Generating Plants) Regulations 2024, document
#           2ce52fb6-595c-539a-ad88-e134fc3fa3af: p. 13 a captive plant pays no CSS (Reg. 11.II);
#           p. 19 banking charge 8% in energy terms for solar and wind (Reg. 12(xi)).
#
# Stated (the calculator's input below, each shown as "you said"): PPA tariff solar 3.10, wind 3.60;
# the plant: solar 42,000/kW, O&M 1.5% of capital a year, CUF 21%, degradation 0.5%/yr, 25 years;
# wind 68,000/kW, O&M 2%, CUF 28%, no degradation, 25 years; equity share 26%. Assumed by ergPLAN:
# a 10% cost of capital (capital recovery factor 0.11016807).
#
# Arithmetic
#   delivered share k = (1 - 3.18%) (1 - 3.00%) = 0.939154
#   losses = (generation + 0.3075 + 0.9318) x (1/k - 1)
#   own plant: average yearly kWh per kW E = 8760 x CUF x mean of (1 - degradation)^y, y = 0..24
#     (solar 1,733.3411; wind 2,452.8); generation = capital x (CRF + O&M) / E, stated to 4 places
#     (solar 3.0329, wind 3.6087)
#   26% equity: equity cost = 26% x capital x CRF / E / k, to 4 places (solar 0.7390, wind 0.8455)
#   captive and 26% equity: CSS charged, then exempt (CRE p. 13), a line of its own
#   banking = (total before the equity line) x (1/(1 - 8%) - 1), on banked units only (beside the
#     landed cost); third party: no approved settlement rule states banking, so none
#   total = the sum of the lines (the banking charge not in it)
# Not stated in any approved rule (the calculator lists them as not yet sourced): the additional
# surcharge, electricity duty on open-access units; for third party, banking.
