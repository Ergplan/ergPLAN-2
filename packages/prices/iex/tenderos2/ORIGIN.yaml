builder:
  path: tools/build_iex_prices.py
  sha256: aa6e92430185272c1df11d05db9b112cadd7b4b21ff14a76bbcfe07a0205eb8a
  note: >-
    Builds both files from IEX's 15-minute market exports (GDAM, DAM, RTM; sheet "15min", column
    "MCP (₹/MWh)"), which are not in the repository. A calendar year of 365 days, each day taken
    from the latest year with data (29 February left out); a block with no price takes the same
    block of the nearest day that has one (counted in blocksFilled). The 15-minute file rounds each
    price to Rs 0.1/MWh; the hourly file is the mean of each hour's four unrounded blocks, rounded
    to Rs 1/MWh.
