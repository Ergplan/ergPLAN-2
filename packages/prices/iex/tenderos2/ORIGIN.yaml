# IEX prices copied from the TenderOS repository (a read-only input, operating rule 7).
# Nothing here is fetched or imported at run time: the two JSON files in this folder are the copies,
# and `python -m ergplan.intake.iex_vintage` loads them into price_series after checking the
# SHA-256 of each against this file. To take a newer build: copy the two files again, change the
# commit and the three hashes here, and run the loader (the old vintages stay for the runs that
# pinned them).
