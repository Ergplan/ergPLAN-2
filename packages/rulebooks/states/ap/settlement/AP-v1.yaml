title: jouleWise State Regulation Master · Andhra Pradesh · FY 2026-27 (register version 10) · settlement
effective_from: '2026-04-01'
effective_to: null
origin: register
approved_by: register-import@ergplan
rows:
- label: Banking and settlement · AP · solar, wind and hybrid, intra-state
  scope:
    source:
    - solar
    - wind
    - hybrid
    connection:
    - intra_state
  body:
    notes: 'Cycle settlement as jouleWise models it (erg_plan 2.0): real-time set-off, then banked energy drawn within the
      banking cycle where the drawal rule allows, the highest-rate ToD category first.'
    method: cycle_pooled
    banking:
      lapse:
        treatment: lapses
      limit:
        combine: drawal
        drawal_pct: '30'
        consumption_pct: '30'
      charge:
        kind: in_kind_percent
        value: '8'
      matrix:
        peak:
        - peak
        - normal
        - off_peak
        normal:
        - normal
        - off_peak
        off_peak:
        - off_peak
      period: monthly
      allowed: true
      drawal_rule: custom
    granularity: block_15min
  source_ref:
    kind: register
    note: 'jouleWise State Regulation Master · Andhra Pradesh · FY 2026-27 (register version 10): banking rule as entered'
    effective_from: '2026-04-01'
