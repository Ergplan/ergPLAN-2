rows:
- label: Banking and settlement · RJ · solar, wind and hybrid, intra-state
  scope:
    source:
    - solar
    - wind
    - hybrid
    connection:
    - intra_state
  body:
    notes: 'Cycle settlement as jouleWise models it (erg_plan 2.0): real-time set-off, then banked energy drawn within the
      banking cycle where the drawal rule allows, the highest-rate ToD category first.'
    method: cycle_pooled
    banking:
      lapse:
        treatment: lapses
      limit:
        combine: max
        drawal_pct: '30'
        generation_pct: '25'
      charge:
        kind: in_kind_percent
        value: '8'
      period: monthly
      allowed: true
      drawal_rule: same_tod
    granularity: block_15min
  source_ref:
