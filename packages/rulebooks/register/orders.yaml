# The orders jouleWise's State Regulation Master (erg-plan-2.0.json) cites, and where each is in
# ergPLAN's document library. Read by `python -m ergplan.regreader.register_pages` (Stage 12),
# which looks for each register figure on the cited page of the stored PDF and, where the text
# layer prints it, proposes a DRAFT whose ref opens that page. Nothing here is a figure.
#
# orders[].cites      the register's citation as it begins (the longest match wins, per state)
# orders[].documents  the PDFs of the order by SHA-256, searched in this order; the document id is
#                     core/ids.py's uuid5 of the hash, the same on every server
# orders[].obtained   false: not in the library; `why` says what is missing and `url_public` where
#                     the regulator publishes it (or where to look)
# figures[]           what the citation alone does not say, written by a person from the stored
#                     page: the pages to read when the register names none (as the order prints
#                     them), text the quoted line must contain when the figure is printed more than
#                     once, or why a figure cannot be grounded. A figure is never written here.
