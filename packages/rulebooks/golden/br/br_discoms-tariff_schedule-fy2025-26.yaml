  - {name: "FY 2025-26 · HTS-I 11 kV · demand", given: {context: {category: "HTS (General) – I (11 kV)"}, field: /demand_charge/value}, expect: {value: "550"}}
  - {name: "FY 2025-26 · HTS-I 11 kV · energy", given: {context: {category: "HTS (General) – I (11 kV)"}, field: /energy_charge/base}, expect: {value: "7.98"}}
  - {name: "FY 2025-26 · HTS-II 33 kV · energy", given: {context: {category: "HTS (General) – II (33 kV)"}, field: /energy_charge/base}, expect: {value: "7.92"}}
  # 9.6 HTS (General – Cold Storage) (11 kV), PDF page 726: 100 / 674.
  - {name: "FY 2025-26 · HTS cold storage 11 kV · energy", given: {context: {category: "HTS (General – Cold Storage) (11 kV)"}, field: /energy_charge/base}, expect: {value: "6.74"}}
  # 10.1 HTIS (Industrial) – I (11 kV), PDF pages 726 (heading) and 727 (rates): 550 / 798.
  - {name: "FY 2025-26 · HTIS-I 11 kV · demand", given: {context: {category: "HTIS (Industrial) – I (11 kV)"}, field: /demand_charge/value}, expect: {value: "550"}}
