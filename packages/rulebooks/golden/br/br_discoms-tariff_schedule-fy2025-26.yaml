  - {name: "FY 2025-26 · HTIS oxygen 11 kV · demand", given: {context: {category: "HTIS (Industrial) - Oxygen Manufacturers (11 kV)"}, field: /demand_charge/value}, expect: {value: "1000"}}
  - {name: "FY 2025-26 · HTIS oxygen 11 kV · energy", given: {context: {category: "HTIS (Industrial) - Oxygen Manufacturers (11 kV)"}, field: /energy_charge/base}, expect: {value: "5.43"}}
  - {name: "FY 2025-26 · HTIS oxygen 33 kV · energy", given: {context: {category: "HTIS (Industrial) - Oxygen Manufacturers (33 kV)"}, field: /energy_charge/base}, expect: {value: "5.37"}}
  # 10.8 HTSS – (33 kV/11 kV), PDF page 730: 800 / 494. 11.0 RTS, PDF page 731: 540 / 816.
  - {name: "FY 2025-26 · HTSS 33/11 kV · demand", given: {context: {category: "HTSS – (33 kV/11 kV)"}, field: /demand_charge/value}, expect: {value: "800"}}
  - {name: "FY 2025-26 · HTSS 33/11 kV · energy", given: {context: {category: "HTSS – (33 kV/11 kV)"}, field: /energy_charge/base}, expect: {value: "4.94"}}
  - {name: "FY 2025-26 · RTS · demand", given: {context: {category: "RTS (Railway Traction)"}, field: /demand_charge/value}, expect: {value: "540"}}
  - {name: "FY 2025-26 · RTS · energy", given: {context: {category: "RTS (Railway Traction)"}, field: /energy_charge/base}, expect: {value: "8.16"}}
