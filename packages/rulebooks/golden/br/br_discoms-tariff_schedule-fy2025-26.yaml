# Written by reading the order's text layer page by page, independently of the importer's output.
# BERC Tariff Order of NBPDCL and SBPDCL for FY 2025-26, effective 1 April 2025 (sha256 a247053b…, 779 pages),
# Appendix 1, Part B: high tension supply. Energy is printed in paise per kVAh; rupees here.
jurisdiction: br_discoms
family: tariff_schedule
effective_on: '2025-08-01'
tests:
