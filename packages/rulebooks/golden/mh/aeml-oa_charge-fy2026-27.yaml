# Written by reading the order's text layer page by page, independently of the importer's output.
# MERC AEML-D MYT Order, Case No. 211 of 2024, dated 28 March 2025 (sha256 2a404108…, 485 pages).
# Wheeling losses approved for each year of the control period: Table 6-25, PDF page 375. The table names supply levels
# (HT, LT), kept as printed in rate_block.
jurisdiction: aeml
family: oa_charge
effective_on: '2026-10-01'
tests:
  - {name: "FY 2026-27 · wheeling loss at HT", given: {context: {connection: intra_state, rate_block: HT}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "1.44"}}
  - {name: "FY 2026-27 · wheeling loss at HT is a percentage in kind", given: {context: {connection: intra_state, rate_block: HT}, where: {/component: wheeling_losses}, field: /basis}, expect: {value: percent_in_kind}}
  - {name: "FY 2026-27 · wheeling loss at LT", given: {context: {connection: intra_state, rate_block: LT}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "5.36"}}
  - {name: "FY 2026-27 · wheeling loss at LT is a percentage in kind", given: {context: {connection: intra_state, rate_block: LT}, where: {/component: wheeling_losses}, field: /basis}, expect: {value: percent_in_kind}}
