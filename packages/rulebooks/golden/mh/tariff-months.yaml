# Months of a consumer's bill worked by hand from the order pages (rates and time-of-day percentages read from the
# text layer of the PDFs, independently of the importer), for the versions imported from the ARR Network. Each case
# is evaluated through rulebook.sandbox on the draft in force at the end of the month and engine.tariff_eval
# (apps/api/tests/regreader/test_arr_mh.py). The schedules state no billing-demand floor in their tables, so the
# demand charge is on the recorded demand. FAC, electricity duty and the power-factor terms are not in the tables.
#
# MERC TPC-D MYT Order (ARR Network order 100): HT I p. 316, its time-of-day table p. 317.
# MERC AEML-D MYT Order (order 104): HT I p. 469 (ToD pp. 469-470); HT II pp. 471-472 (ToD p. 472).
# MERC BEST MYT Order (order 108): HT II pp. 405-406 (ToD p. 406), HT V pp. 413-414 (ToD p. 414).
