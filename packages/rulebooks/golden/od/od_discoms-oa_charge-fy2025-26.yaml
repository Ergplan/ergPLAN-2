# Written by reading the order's text layer page by page, independently of the importer's output.
# OERC retail supply tariff order for FY 2025-26 (ARR Network order 50, sha256 de53fe6f…, 169 pages): Table 39, PDF p. 96 (para 157), the last column, printed once for
# the four licensees: 'shall pay Rs.6120/MW-day (Rs.255/MWh) as transmission charges', 'applicable for HT & EHT
# Consumers'. Cross-subsidy surcharge and wheeling charge are per licensee (tpcodl, tpnodl, tpsodl, tpwodl).
jurisdiction: od_discoms
family: oa_charge
effective_on: '2025-05-01'
tests:
  - {name: "FY 2025-26 · transmission charge for an HT open-access consumer", given: {context: {connection: "intra_state", consumer_kind: "ht", voltage_kv: 33}, where: {/component: stu_transmission}, field: /value}, expect: {value: "6120"}}
  - {name: "FY 2025-26 · transmission charge for an EHT open-access consumer", given: {context: {connection: "intra_state", consumer_kind: "eht", voltage_kv: 132}, where: {/component: stu_transmission}, field: /value}, expect: {value: "6120"}}
  - {name: "FY 2025-26 · the transmission charge is per MW per day", given: {context: {connection: "intra_state", consumer_kind: "ht", voltage_kv: 33}, where: {/component: stu_transmission}, field: /basis}, expect: {value: "inr_per_mw_day"}}
  - {name: "FY 2025-26 · no transmission charge is stated for LT", given: {context: {connection: "intra_state", consumer_kind: "lt", voltage_kv: 0.4}, where: {/component: stu_transmission}}, expect: {absent: true}}
  - {name: "FY 2025-26 · the group holds no surcharge of its own", given: {context: {connection: "intra_state", consumer_kind: "ht", voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}}, expect: {absent: true}}
