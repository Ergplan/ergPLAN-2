# Months of a consumer's bill worked by hand from the order pages (rates read from the text layer of the PDF,
# independently of the importer), for the version imported from the ARR Network; evaluated as in
# golden/cg/tariff-months.yaml (apps/api/tests/regreader/test_arr_states_cg_od_uk_tn.py). Recorded demand equals
# contract demand in every case. TNERC prints energy charges in paise per kWh; HT supply is billed on kWh.
# The ARR Network read no time-of-day table for this order, so no case splits its units by slot.
#
# TNERC T.O. No. 6 of 2025 (order 184, in force from 1 July 2025): HT Tariff I p. 24, HT Tariff III p. 29.
origin: arr_network
state: TN
cases:
  - name: TNPDCL High Tension Tariff I at 33 kV, 2,000 kVA, October 2025
    # demand 2,000 kVA x 608 = 1,216,000; energy 1,000,000 kWh x 7.50 = 7,500,000
    discom: tnpdcl
    category: High Tension Tariff I
    voltage_kv: 33
    month: 2025-10
    contract_kva: 2000
    max_kva: 2000
    units: 1000000
    by_slot: {}
    expect: {tariff_year: FY2025-26, demand_charge: "1216000.00", energy_charge: "7500000.00", tod_adjustment: "0.00", total: "8716000.00"}
  - name: TNPDCL High Tension Tariff III at 11 kV, 500 kVA, March 2026
    # demand 500 x 608 = 304,000; energy 120,000 x 9.40 = 1,128,000
    discom: tnpdcl
    category: High Tension Tariff III
    voltage_kv: 11
    month: 2026-03
    contract_kva: 500
    max_kva: 500
    units: 120000
    by_slot: {}
    expect: {tariff_year: FY2025-26, demand_charge: "304000.00", energy_charge: "1128000.00", tod_adjustment: "0.00", total: "1432000.00"}
