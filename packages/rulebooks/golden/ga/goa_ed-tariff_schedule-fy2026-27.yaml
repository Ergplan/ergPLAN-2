# FY 2026-27 columns of Table 187 "Approved tariff by the Commission for 4th Control Period", PDF pages 228-230. The
# year's rates apply from 1 April 2026; the order sets the next year's from 1 April 2027 (not imported).
# FY 2026-27: HTS-IV Rs 280.00/kVA/month and Rs 5.60/kVAh; HTS-I 120.00 and 5.85; EHTS-II 275.00 and 5.50.
jurisdiction: goa_ed
family: tariff_schedule
effective_on: '2026-08-01'
origin: arr_network
tests:
