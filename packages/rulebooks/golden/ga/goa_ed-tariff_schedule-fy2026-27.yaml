  - {name: "GA FY 2026-27 · HTS-IV · fixed", given: {context: {category: HTS-IV, voltage_kv: 11}, field: /demand_charge/value}, expect: {value: "280"}}
  - {name: "GA FY 2026-27 · HTS-I · energy", given: {context: {category: HTS-I, voltage_kv: 11}, field: /energy_charge/base}, expect: {value: "5.85"}}
  - {name: "GA FY 2026-27 · EHTS-II · energy", given: {context: {category: EHTS-II, voltage_kv: 110}, field: /energy_charge/base}, expect: {value: "5.50"}}
