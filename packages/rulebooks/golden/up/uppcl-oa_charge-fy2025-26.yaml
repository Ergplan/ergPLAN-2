# Written by reading the order's text layer page by page, independently of the importer's output.
# UPERC State DISCOMs Tariff Order FY 2025-26 (sha256 e687a4c7…, 568 pages), in force from 22 Nov 2025 until the FY 2026-27 order.
# Wheeling Table 10-3 (p. 452); distribution losses for OA consumers Table 10-11 (p. 462); CSS Table 10-14 column D 'Approved' (p. 464);
# green tariff Table 8-8 'Green Tariff Approved' (p. 430).
jurisdiction: uppcl
family: oa_charge
effective_on: '2026-01-15'
tests:
  - {name: "FY 2025-26 · average wheeling 0.9985", given: {context: {connection: intra_state}, where: {/component: wheeling}, field: /value}, expect: {value: "0.9985"}}
  - {name: "FY 2025-26 · wheeling is per kWh", given: {context: {connection: intra_state}, where: {/component: wheeling}, field: /basis}, expect: {value: inr_per_kwh}}
  - {name: "FY 2025-26 · distribution loss at 0.4 kV", given: {context: {connection: intra_state, voltage_kv: 0.4}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "13.35"}}
  - {name: "FY 2025-26 · distribution loss at 11 kV", given: {context: {connection: intra_state, voltage_kv: 11}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "8.00"}}
