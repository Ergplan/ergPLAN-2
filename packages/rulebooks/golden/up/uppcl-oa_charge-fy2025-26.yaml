  - {name: "FY 2025-26 · distribution loss at 132 kV", given: {context: {connection: intra_state, voltage_kv: 132}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "1.00"}}
  - {name: "FY 2025-26 · CSS HV-2 at 11 kV", given: {context: {connection: intra_state, category: HV-2, voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "0.38"}}
