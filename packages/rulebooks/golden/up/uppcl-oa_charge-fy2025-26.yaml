  - {name: "FY 2025-26 · CSS HV-2 at 132 kV", given: {context: {connection: intra_state, category: HV-2, voltage_kv: 132}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "0.33"}}
  - {name: "FY 2025-26 · CSS HV-2 at 220 kV", given: {context: {connection: intra_state, category: HV-2, voltage_kv: 220}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "0.14"}}
  - {name: "FY 2025-26 · CSS HV-1 at 11 kV", given: {context: {connection: intra_state, category: HV-1, voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.57"}}
  - {name: "FY 2025-26 · CSS HV-1 at 33 kV", given: {context: {connection: intra_state, category: HV-1, voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.36"}}
  - {name: "FY 2025-26 · CSS HV-4 at 11 kV", given: {context: {connection: intra_state, category: HV-4, voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.51"}}
  - {name: "FY 2025-26 · CSS HV-4 at 33 kV", given: {context: {connection: intra_state, category: HV-4, voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.40"}}
  - {name: "FY 2025-26 · CSS HV-4 at 132 kV", given: {context: {connection: intra_state, category: HV-4, voltage_kv: 132}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.29"}}
