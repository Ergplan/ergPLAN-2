# Months of a consumer's bill worked by hand from the order pages (rates and ToD windows read from the text
# layer of the PDFs, independently of the importer), for the versions imported from the ARR Network. Each case is
# evaluated through rulebook.sandbox on the draft in force at the end of the month and engine.tariff_eval
# (apps/api/tests/regreader/test_arr_months.py). Recorded demand is at or above 75% of contract demand in every
# case, so the billable-demand floor (a rule the orders state in words, which no table holds) does not enter.
#
# UPERC State DISCOMs FY 2025-26 (order 65): HV-2 urban p. 526, ToD p. 527, HV-4 p. 532.
# UPERC State DISCOMs FY 2026-27 (order 67): HV-2 urban p. 445, ToD p. 446.
# UPERC NPCL FY 2025-26 (order 64): HV-2 urban p. 446, ToD p. 447. NPCL FY 2026-27 (order 66): p. 387, ToD p. 388.
origin: arr_network
cases:
  - name: PVVNL HV-2 at 33 kV, 3,000 kVA contract, December 2025 (FY 2025-26 order)
    # demand 2,800 kVA x 290 = 812,000; energy 1,200,000 kVAh x 6.80 = 8,160,000;
    # 17:00-23:00 +15%: 330,000 x 6.80 x 0.15 = 336,600; 23:00-05:00 -15%: 210,000 x 6.80 x 0.15 = 214,200
    discom: pvvnl
    category: HV-2
    rate_block: urban
    voltage_kv: 33
    month: 2025-12
    contract_kva: 3000
    max_kva: 2800
    units: 1200000
    by_slot: {"05:00 hrs – 11:00 hrs": 300000, "11:00 hrs – 17:00 hrs": 360000, "17:00 hrs – 23:00 hrs": 330000, "23:00 hrs – 05:00 hrs": 210000}
    expect: {tariff_year: FY2025-26, demand_charge: "812000.00", energy_charge: "8160000.00", tod_adjustment: "122400.00", total: "9094400.00"}
