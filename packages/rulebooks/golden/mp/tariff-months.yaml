# Months of a consumer's bill worked by hand from the order pages (rates read from the text layer of the PDFs,
# independently of the importer), for the versions imported from the ARR Network. Each case is evaluated through
# rulebook.sandbox on the draft in force at the end of the month and engine.tariff_eval
# (apps/api/tests/regreader/test_arr_gj_mp_br.py). Recorded demand is at or above 90% of contract demand and not
# above it in every case, so the billing-demand floor and excess-demand rules (stated in words) do not enter.
# No time-of-day rows are imported for Madhya Pradesh, so by_slot is empty.
#
# MPERC FY 2026-27 (ARR Network order 41): HV-1 p. 226, HV-5 p. 239. MPERC FY 2025-26 (order 42): HV-1 p. 230.
origin: arr_network
state: MP
cases:
  - name: Central DISCOM HV-1 railway traction at 132 kV, 10,000 kVA contract, August 2026 (FY 2026-27 order)
    # fixed 9,500 x 354 = 3,363,000; energy 4,000,000 x 6.26 = 25,040,000
    discom: mpmkvvcl
    category: HV-1
    voltage_kv: 132
    month: 2026-08
    contract_kva: 10000
    max_kva: 9500
    units: 4000000
    by_slot: {}
    expect: {tariff_year: FY2026-27, demand_charge: "3363000.00", energy_charge: "25040000.00", tod_adjustment: "0.00", total: "28403000.00"}
  - name: West DISCOM HV-5 at 11 kV, 500 kVA contract, September 2026 (FY 2026-27 order)
    # fixed 480 x 399 = 191,520; energy 150,000 x 6.55 = 982,500
    discom: mppkvvcl
    category: HV-5
    voltage_kv: 11
    month: 2026-09
    contract_kva: 500
    max_kva: 480
    units: 150000
    by_slot: {}
    expect: {tariff_year: FY2026-27, demand_charge: "191520.00", energy_charge: "982500.00", tod_adjustment: "0.00", total: "1174020.00"}
  - name: Central DISCOM HV-1 railway traction at 132 kV, 10,000 kVA contract, December 2025 (FY 2025-26 order)
    # fixed 9,500 x 344 = 3,268,000; energy 4,000,000 x 6.06 = 24,240,000
    discom: mpmkvvcl
    category: HV-1
    voltage_kv: 132
    month: 2025-12
    contract_kva: 10000
    max_kva: 9500
    units: 4000000
    by_slot: {}
    expect: {tariff_year: FY2025-26, demand_charge: "3268000.00", energy_charge: "24240000.00", tod_adjustment: "0.00", total: "27508000.00"}
