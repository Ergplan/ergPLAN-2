# Written by reading the order's text layer page by page, independently of the importer's output.
# CSERC Tariff Order for CSPDCL, FY 2026-27 (ARR Network order 73, sha256 7c77f6d6…, 227 pages); the schedule applies
# from 1 July 2026 (para 19, PDF p. 8, and the head of the tariff schedule, PDF p. 189).
# LV-4 p. 192, LV-5 pp. 193-194, LV-7 p. 195, HV-2 and HV-3 pp. 204-205, HV-4 p. 205, HV-5 and HV-6 p. 207, HV-9 p. 209.
# A category answers to its code (HV-3) and to its printed name. The 33 kV and 11 kV rows of HV-3 and HV-4 are printed
# per load factor ('>15%', '<=15%'): the importer writes the sign in words, and a case without it is not answered.
jurisdiction: cspdcl
family: tariff_schedule
effective_on: '2026-08-01'
tests:
  - {name: "FY 2026-27 · HV-2 Mines at 220 kV · demand", given: {context: {category: "HV-2", voltage_kv: 220}, field: /demand_charge/value}, expect: {value: "500"}}
